<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Password Generator | Yuvarajan J</title>
<link rel="stylesheet" href="style.css">
</head>
<body>

<div class="container">
  <h1>Password Generator <span>🔐</span></h1>
  <p class="subtitle">Generate strong, random passwords instantly</p>

  <div class="password-display">
    <input type="text" id="password" readonly placeholder="Your password will appear here">
    <button id="copyBtn" class="icon-btn" title="Copy to clipboard">📋</button>
  </div>

  <div class="strength-meter">
    <div class="strength-bar" id="strengthBar"></div>
  </div>
  <p class="strength-label" id="strengthLabel">Strength: —</p>

  <div class="option-row">
    <label for="length">Length: <span id="lengthValue">12</span></label>
    <input type="range" id="length" min="4" max="32" value="12">
  </div>

  <div class="checkbox-grid">
    <label class="checkbox-item">
      <input type="checkbox" id="uppercase" checked>
      Uppercase (A-Z)
    </label>
    <label class="checkbox-item">
      <input type="checkbox" id="lowercase" checked>
      Lowercase (a-z)
    </label>
    <label class="checkbox-item">
      <input type="checkbox" id="numbers" checked>
      Numbers (0-9)
    </label>
    <label class="checkbox-item">
      <input type="checkbox" id="symbols" checked>
      Symbols (!@#$...)
    </label>
  </div>

  <button id="generateBtn" class="primary-btn">Generate Password</button>
</div>

<script src="script.js"></script>
</body>
</html>
